name: Research validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/agent-rl/requirements.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r services/agent-rl/requirements.txt
      - name: Source and unit checks
        run: |
          git diff --check
          bash -n reproduce.sh services/agent-rl/scripts/ci_smoke.sh
          python -m compileall -q services/agent-rl/nano_rl services/agent-rl/scripts
          cd services/agent-rl
          python -m pytest -q
      - name: End-to-end scientific smoke run
        env:
          SMOKE_OUT: ${{ runner.temp }}/research-smoke
        run: bash services/agent-rl/scripts/ci_smoke.sh
      - name: Verify selected release and manuscripts
        run: |
          python services/agent-rl/scripts/verify_release.py --run data/releases/research_v1 --corpus data/releases/market_snapshot_v1/corpus.npz
          python services/agent-rl/scripts/audit_market_rollouts.py --run data/releases/research_v1 --corpus data/releases/market_snapshot_v1/corpus.npz --out "$RUNNER_TEMP/selected-rollout-parity.json"
          python services/agent-rl/scripts/verify_paper_numbers.py
      - name: Independent-bank execution and checkpoint replay
        run: |
          python services/agent-rl/scripts/calibrate_reference_banks.py --out "$RUNNER_TEMP/bank-smoke" --quick --seed 17
          python services/agent-rl/scripts/study_archive.py pack --source "$RUNNER_TEMP/bank-smoke" --out "$RUNNER_TEMP/bank-bundle"
          python services/agent-rl/scripts/objective_study.py --out "$RUNNER_TEMP/objective-replication" --original "$RUNNER_TEMP/research-smoke/reports" --quick
          python services/agent-rl/scripts/verify_replications.py --banks "$RUNNER_TEMP/bank-bundle" --replay-proof "$RUNNER_TEMP/bank-replay.json" --replay-models --objectives "$RUNNER_TEMP/objective-replication" --original "$RUNNER_TEMP/research-smoke/reports" --allow-quick --out "$RUNNER_TEMP/replication-statistics.json"
      - name: Retain smoke artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: research-smoke
          path: |
            ${{ runner.temp }}/research-smoke/reports
            ${{ runner.temp }}/research-smoke/publication
            ${{ runner.temp }}/bank-smoke
            ${{ runner.temp }}/bank-replay.json
            ${{ runner.temp }}/objective-replication
            ${{ runner.temp }}/replication-statistics.json
          if-no-files-found: ignore
          retention-days: 7
