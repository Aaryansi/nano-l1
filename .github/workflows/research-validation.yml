name: Research validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/agent-rl/requirements.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r services/agent-rl/requirements.txt
      - name: Source and unit checks
        run: |
          git diff --check
          bash -n reproduce.sh services/agent-rl/scripts/ci_smoke.sh
          python -m compileall -q services/agent-rl/nano_rl services/agent-rl/scripts
          cd services/agent-rl
          python -m pytest -q
      - name: End-to-end scientific smoke run
        env:
          SMOKE_OUT: ${{ runner.temp }}/research-smoke
        run: bash services/agent-rl/scripts/ci_smoke.sh
      - name: Retain smoke artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: research-smoke
          path: |
            ${{ runner.temp }}/research-smoke/reports
            ${{ runner.temp }}/research-smoke/publication
          if-no-files-found: ignore
          retention-days: 7
