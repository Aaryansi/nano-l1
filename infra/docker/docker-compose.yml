services:
  # -------------------- Postgres --------------------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nano
      POSTGRES_PASSWORD: nano
      POSTGRES_DB: nano_l1
    ports:
      - "5432:5432"
    volumes:
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data

  # -------------------- Zookeeper --------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # -------------------- Kafka (ZK mode) --------------------
  kafka:
    image: confluentinc/cp-kafka:7.4.4
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # internal + external access
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # single-broker friendly settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # -------------------- Engine --------------------
  engine:
    build: ../../services/engine-go
    environment:
      ENGINE_PORT: "8080"
      DATABASE_URL: "postgres://nano:nano@db:5432/nano_l1?sslmode=disable"
      KAFKA_BROKERS: "kafka:9092"
    ports:
      - "8080:8080"
    depends_on:
      - db
      - kafka

  # -------------------- Dashboard --------------------
  dashboard:
    build: ../../services/dashboard-react
    environment:
      VITE_WS_URL: "ws://localhost:8080/ws"
    ports:
      - "5173:5173"
    depends_on:
      - engine

  # -------------------- Backtest --------------------
  backtest:
    build:
      context: ../../services/backtest-py
      dockerfile: Dockerfile
    volumes:
      # map repo CSV → container /data/ticks.csv
      - ../../data/sample_ticks.csv:/data/ticks.csv:ro
    environment:
      - TICKS_CSV=/data/ticks.csv
    command: ["python", "backtest.py", "--max-ticks", "2000000"]

  # -------------------- Feed Simulator --------------------
  feed-sim:
    build: ../../services/feed-sim
    environment:
      KAFKA_BROKERS: "kafka:9092"
      TICKS_TOPIC: "ticks"
      DATA_FILE: "/data/sample/sample_ticks.csv"
      REPLAY_SLEEP_MS: "100"
    volumes:
      - ../../data:/data
    depends_on:
      - kafka

volumes:
  pgdata:
