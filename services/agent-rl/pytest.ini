[pytest]
testpaths = tests
addopts = -q

# the unnormalized-feature guard exists to catch a silent learning failure in
# training scripts. accounting and no-lookahead tests deliberately use raw
# features because they test arithmetic, not learning, so the warning is noise
# there. tests/test_agents.py::TestNormalizerGuard asserts it still fires.
filterwarnings =
    ignore:BinaryMarketEnv built without a normalizer:RuntimeWarning
